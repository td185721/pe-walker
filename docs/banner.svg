<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">pe-walker</title>
  <desc id="desc">Walk a Windows executable from its MZ header to its last import.</desc>
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .r { opacity: 0; animation: show 0.25s ease-out forwards; }
    @keyframes show { to { opacity: 1; } }
    .r0 { animation-delay: 0.50s; } .r1 { animation-delay: 0.59s; } .r2 { animation-delay: 0.68s; } .r3 { animation-delay: 0.77s; } .r4 { animation-delay: 0.86s; } .r5 { animation-delay: 0.95s; } .r6 { animation-delay: 1.04s; } .r7 { animation-delay: 1.13s; } .r8 { animation-delay: 1.22s; } .r9 { animation-delay: 1.31s; } .r10 { animation-delay: 1.40s; } .r11 { animation-delay: 1.49s; } .r12 { animation-delay: 1.58s; } .r13 { animation-delay: 1.67s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) { .r { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern>
    <radialGradient id="glow" cx="250" cy="150" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa657" stop-opacity="0.14"/><stop offset="1" stop-color="#ffa657" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="0.6" stop-color="#ffa657" stop-opacity="0.35"/><stop offset="1" stop-color="#ffa657" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect width="1200" height="3" fill="url(#edge)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="92" class="mono" font-size="13.5" letter-spacing="2.2" fill="#ffa657">PE/COFF · STRUCTURE INSPECTOR</text>
  <text x="61" y="168" class="mono" font-size="64" font-weight="700" fill="#e6edf3">pe-walker</text>
  <text x="64" y="212" class="mono" font-size="19" fill="#8b949e">Walk a Windows executable from its</text>
  <text x="64" y="240" class="mono" font-size="19" fill="#8b949e">MZ header to its last import.<tspan class="cursor" fill="#ffa657"> &#9608;</tspan></text>
  <g transform="translate(64 266)"><rect width="84" height="30" rx="15" fill="#161b22" stroke="#30363d"/><circle cx="18" cy="15" r="5" fill="#f34b7d"/><text x="31" y="20" class="mono" font-size="14" fill="#c9d1d9">C++17</text></g>
  <g transform="translate(158 266)"><rect width="104" height="30" rx="15" fill="#161b22" stroke="#30363d"/><circle cx="18" cy="15" r="5" fill="#79c0ff"/><text x="31" y="20" class="mono" font-size="14" fill="#c9d1d9">Windows</text></g>
  <g transform="translate(272 266)"><rect width="88" height="30" rx="15" fill="#161b22" stroke="#30363d"/><circle cx="18" cy="15" r="5" fill="#fcc624"/><text x="31" y="20" class="mono" font-size="14" fill="#c9d1d9">Linux</text></g>
  <g transform="translate(370 266)"><rect width="88" height="30" rx="15" fill="#161b22" stroke="#30363d"/><circle cx="18" cy="15" r="5" fill="#c9d1d9"/><text x="31" y="20" class="mono" font-size="14" fill="#c9d1d9">macOS</text></g>
  <rect x="628" y="30" width="536" height="282" rx="10" fill="#010409" stroke="#21262d" stroke-width="1.5"/>
  <text x="650" y="57" class="mono" font-size="12.5"><tspan fill="#7ee787">$</tspan><tspan fill="#8b949e"> pe-walker --summary sample64.dll</tspan></text>
  <line x1="628" y1="72" x2="1164" y2="72" stroke="#21262d" stroke-width="1.5"/>
  <text x="650" y="96.0" class="mono r r0" font-size="11.8" textLength="78.1" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#e6edf3">File header</tspan></text>
  <text x="650" y="111.2" class="mono r r1" font-size="11.8" textLength="276.9" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">  machine</tspan><tspan fill="#6e7681">        : </tspan><tspan fill="#c9d1d9">x64 (AMD64) (0x8664)</tspan></text>
  <text x="650" y="126.4" class="mono r r2" font-size="11.8" textLength="142.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">  sections</tspan><tspan fill="#6e7681">       : </tspan><tspan fill="#c9d1d9">5</tspan></text>
  <text x="650" y="141.6" class="mono r r3" font-size="11.8" textLength="106.5" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#e6edf3">Optional header</tspan></text>
  <text x="650" y="156.8" class="mono r r4" font-size="11.8" textLength="205.9" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">  entry point</tspan><tspan fill="#6e7681">    : </tspan><tspan fill="#c9d1d9">0x0000177c</tspan></text>
  <text x="650" y="172.0" class="mono r r5" font-size="11.8" textLength="262.7" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">  image base</tspan><tspan fill="#6e7681">     : </tspan><tspan fill="#c9d1d9">0x0000000180000000</tspan></text>
  <text x="650" y="187.2" class="mono r r6" font-size="11.8" textLength="241.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">  subsystem</tspan><tspan fill="#6e7681">      : </tspan><tspan fill="#c9d1d9">Windows GUI (2)</tspan></text>
  <text x="650" y="202.4" class="mono r r7" font-size="11.8" textLength="85.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#e6edf3">Sections (5)</tspan></text>
  <text x="650" y="217.6" class="mono r r8" font-size="11.8" textLength="504.1" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#6e7681">  name       virt_size  virt_addr   raw_size raw_offset characteristics</tspan></text>
  <text x="650" y="232.8" class="mono r r9" font-size="11.8" textLength="468.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffa657">  .text     </tspan><tspan fill="#79c0ff">0x00001358</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00001000</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00001400</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00000400</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x60000020</tspan></text>
  <text x="650" y="248.0" class="mono r r10" font-size="11.8" textLength="468.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffa657">  .rdata    </tspan><tspan fill="#79c0ff">0x0000183c</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00003000</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00001a00</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00001800</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x40000040</tspan></text>
  <text x="650" y="263.2" class="mono r r11" font-size="11.8" textLength="468.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffa657">  .data     </tspan><tspan fill="#79c0ff">0x00000338</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00005000</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00000400</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00003200</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0xc0000040</tspan></text>
  <text x="650" y="278.4" class="mono r r12" font-size="11.8" textLength="468.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffa657">  .pdata    </tspan><tspan fill="#79c0ff">0x0000024c</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00006000</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00000400</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00003600</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x40000040</tspan></text>
  <text x="650" y="293.6" class="mono r r13" font-size="11.8" textLength="468.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffa657">  .reloc    </tspan><tspan fill="#79c0ff">0x000000a0</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00007000</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00000200</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x00003a00</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">0x42000040</tspan></text>
</svg>
